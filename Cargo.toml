[package]
name = "hdrhistogram-pyo3"
version = "0.1.0"
edition = "2021"

[lib]
name = "hdrhistogram_pyo3"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
pyo3-polars = { version = "0.26.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.53.0", default-features = false }
hdrhistogram = "7"

[package.metadata.maturin]
python-source = "venv"
