[package]
name = "hdrhistogram-pyo3"
version = "0.1.0"
edition = "2021"

[lib]
name = "hdrhistogram_pyo3"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "chrono", "abi3-py38"] }
pyo3-polars = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.53", default-features = false }
hdrhistogram = "7"
base64 = "0.21.7"
chrono = "0.4.39"

[package.metadata.maturin]
python-source = "venv"
